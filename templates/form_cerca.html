{% extends "base.html" %}{% block title %}{{ 'Editar cerca' if cerca else 'Nova cerca' }}{% endblock %}{% block heading %}{{ 'Editar cerca' if cerca else 'Cadastrar cerca' }}{% endblock %}
{% block content %}<form method="post" class="panel form-panel"><div class="form-grid"><label>Nome da cerca *<input name="nome" required value="{{ request.form.get('nome', '') if request.method == 'POST' else (cerca.nome if cerca else '') }}"></label><label>Tipo<input name="tipo" value="{{ request.form.get('tipo', '') if request.method == 'POST' else (cerca.tipo if cerca else '') }}" placeholder="Ex.: velocidade, área de risco"></label><label>Velocidade (km/h)<input name="velocidade" type="number" min="0" step="0.01" value="{{ request.form.get('velocidade', '') if request.method == 'POST' else (cerca.velocidade if cerca and cerca.velocidade is not none else '') }}"></label><label class="check-label"><input type="checkbox" name="ativo" {% if ((request.form.get('ativo') == 'on') if request.method == 'POST' else (cerca is none or cerca.ativo)) %}checked{% endif %}> Cerca ativa</label><label class="full">Descrição<textarea name="descricao" rows="4">{{ request.form.get('descricao', '') if request.method == 'POST' else (cerca.descricao if cerca else '') }}</textarea></label></div><div class="form-actions"><a class="btn" href="{{ url_for('listar_cercas') }}">Cancelar</a><button class="btn primary">Salvar cerca</button></div></form>{% endblock %}
